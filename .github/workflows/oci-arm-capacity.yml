name: OCI ARM Host Capacity Checker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: oci-capacity-check
  cancel-in-progress: false

jobs:
  check-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        extensions: curl, json, openssl
        
    - name: Install dependencies
      run: composer install --no-interaction --prefer-dist --no-progress
      
    - name: Setup OCI private key
      run: |
        mkdir -p ~/.oci
        echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/key.pem
        chmod 600 ~/.oci/key.pem
        
    - name: Create .env file
      run: |
        cat > .env << 'EOF'
        OCI_REGION=${{ secrets.OCI_REGION }}
        OCI_USER_ID=${{ secrets.OCI_USER_ID }}
        OCI_TENANCY_ID=${{ secrets.OCI_TENANCY_ID }}
        OCI_KEY_FINGERPRINT=${{ secrets.OCI_KEY_FINGERPRINT }}
        OCI_PRIVATE_KEY_FILENAME=/home/runner/.oci/key.pem
        OCI_SUBNET_ID=${{ secrets.OCI_SUBNET_ID }}
        OCI_IMAGE_ID=${{ secrets.OCI_IMAGE_ID }}
        OCI_SSH_PUBLIC_KEY=${{ secrets.OCI_SSH_PUBLIC_KEY }}
        OCI_SHAPE=VM.Standard.A1.Flex
        OCI_OCPUS=4
        OCI_MEMORY_IN_GBS=24
        OCI_MAX_INSTANCES=1
        EOF
        
    - name: Run capacity check
      run: php index.php
      
    - name: Upload log artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: oci-log-${{ github.run_number }}-${{ github.run_attempt }}
        path: |
          *.log
        retention-days: 7
